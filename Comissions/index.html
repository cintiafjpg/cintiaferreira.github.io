
<!DOCTYPE html>

    <title>Commissions — Cíntia Ferreira</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .commissions-list {
            margin-top: 3rem;
        }

        .commission-link {
            display: block;
            position: relative;
            width: fit-content;
            margin: 0 0 1.2rem;
            font-size: clamp(1.4rem, 3vw, 2.5rem);
            text-decoration: none;
        }

        .commission-preview {
            display: none;
            position: absolute;
            left: calc(100% + 2rem);
            top: 50%;
            transform: translateY(-50%);
            width: 220px;
            max-height: 260px;
            object-fit: cover;
            z-index: 10;
            pointer-events: none;
        }

        .commission-link:hover .commission-preview {
            display: block;
        }

        @media (max-width: 700px) {
            .commission-preview {
                display: none !important;
            }
        }
    </style>
</head>
