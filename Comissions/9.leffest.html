
<!DOCTYPE html>

<head>

    <title>LEFFEST — Cíntia Ferreira</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .leffest-grid {
            columns: 3 240px;
            column-gap: 12px;
            margin-top: 2rem;
        }

        .leffest-grid figure {
            margin: 0 0 12px;
            break-inside: avoid;
        }

        .leffest-grid img {
            display: block;
            width: 100%;
            height: auto;
        }

        .leffest-back {
            margin-top: 3rem;
        }

        @media (max-width: 600px) {
            .leffest-grid {
                columns: 2 140px;
                column-gap: 8px;
            }

            .leffest-grid figure {
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>

    <main class="commissions-page">
