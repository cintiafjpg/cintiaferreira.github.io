    <style>
        .leffest-grid {
            columns: 3 240px;
            column-gap: 12px;
            margin-top: 2rem;
        }

        .leffest-grid figure {
            margin: 0 0 12px;
            break-inside: avoid;
        }

        .leffest-grid img {
            display: block;
            width: 100%;
            height: auto;
        }

        .leffest-back {
            margin-top: 3rem;
        }

        @media (max-width: 600px) {
            .leffest-grid {
                columns: 2 140px;
                column-gap: 8px;
            }

            .leffest-grid figure {
                margin-bottom: 8px;
            }
        }
        .leffest-grid figure {
    position: relative;
    overflow: hidden;
}

.leffest-grid figcaption {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.65);
    color: white;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.leffest-grid figure:hover figcaption {
    opacity: 1;
}
    </style>
</head>
