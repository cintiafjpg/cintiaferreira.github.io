<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request the film — Cíntia Ferreira</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="request-film-page">

        <div class="request-film-content">

            <h1>
                <em>Déjà vu</em>
            </h1>

            <p class="request-film-intro">
                For screening, festival, curatorial or research purposes,
                please use the form below to request access to the film.
            </p>


            <form action="https://formspree.io/f/mwlpalaz" method="POST">

                <label>
                    Name
                    <input type="text" name="name" required>
                </label>


                <label>
                    Email
                    <input type="email" name="email" required>
                </label>


                <label>
                    Institution / Festival / Organisation
                    <input type="text" name="organisation">
                </label>


                <label>
                    Reason for request
                    <textarea name="message" rows="6" required></textarea>
                </label>


                <button type="submit">
                    Request the film
                </button>

            </form>


            <a href="index.html#deja-vu" class="request-film-back">
                ← Back to <em>Déjà vu</em>
            </a>

        </div>

    </main>

</body>

</html>
