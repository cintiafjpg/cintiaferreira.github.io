<form action="https://formspree.io/f/xjykajdv"
      method="POST"
      class="catalog-form">

    <label for="name">
        Name
    </label>

    <input
        type="text"
        id="name"
        name="name"
        required
    >


    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
        name="email"
        required
    >


    <label for="message">
        Message
    </label>

    <textarea
        id="message"
        name="message"
        rows="5"
        placeholder="If you wish, you may include a message."
    ></textarea>


    <input
        type="hidden"
        name="_subject"
        value="Catalogue request — Evidências"
    >


    <button type="submit">
        Send request
    </button>

</form>
