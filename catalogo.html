<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catalogue — Evidências</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header>

    <div class="site-title">
        CÍNTIA FERREIRA
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#evidencias">Evidências</a>
        <a href="index.html#memorabilia">Memorabilia</a>
        <a href="index.html#about">About</a>
    </nav>

</header>


<main class="page">

    <div class="about">

        <h1>Catalogue — Evidências</h1>

        <p>
            To request access to the catalogue of the exhibition
            <em>Evidências</em>, including information and prices of the works,
            please fill in the form below.
        </p>


        <form action="https://formspree.io/f/xjykajdv"
              method="POST"
              class="catalog-form">


            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="If you wish, you may include a message."
            ></textarea>


            <input
                type="hidden"
                name="_subject"
                value="Catalogue request — Evidências"
            >


            <button type="submit">
                Send request
            </button>

        </form>

    </div>

</main>


</body>

</html>
